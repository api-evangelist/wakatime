components:
  parameters:
    ProjectPath:
      name: project
      in: path
      required: true
      description: Project name.
      schema:
        type: string
      example: example
  schemas:
    Commit:
      type: object
      properties:
        id:
          type: string
          example: 5f8a2c7f-8b3a-4c2c-9b3f-1d2c4f5b6a7c
        author_avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://wakatime.com/photo/5f8a2c7f-8b3a-4c2c-9b3f-1d2c4f5b6a7c
        author_date:
          type: string
          format: date-time
          example: '2026-05-30T12:34:56Z'
        author_email:
          type: string
          format: email
          nullable: true
          example: kin@apievangelist.com
        author_html_url:
          type: string
          format: uri
          nullable: true
          example: https://github.com/kinlane
        author_id:
          type: string
          nullable: true
          example: 5f8a2c7f-8b3a-4c2c-9b3f-1d2c4f5b6a7c
        author_name:
          type: string
          example: Kin Lane
        author_url:
          type: string
          format: uri
          nullable: true
          example: https://wakatime.com/@kinlane
        author_username:
          type: string
          nullable: true
          example: kinlane
        branch:
          type: string
          nullable: true
          example: main
        committer_avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://wakatime.com/photo/5f8a2c7f-8b3a-4c2c-9b3f-1d2c4f5b6a7c
        created_at:
          type: string
          format: date-time
          example: '2026-05-30T12:34:56Z'
        hash:
          type: string
          example: 9b8c4d2e6f1a3b5c7d9e8f0a1b2c3d4e5f6a7b8c
        html_url:
          type: string
          format: uri
          nullable: true
          example: https://github.com/wakatime/wakatime-cli/commit/9b8c4d2e6f1a3b5c7d9e8f0a1b2c3d4e5f6a7b8c
        human_readable_natural_total_time:
          type: string
          nullable: true
          example: about 4 hours
        human_readable_total:
          type: string
          nullable: true
          example: 4 hrs 12 mins
        human_readable_total_with_seconds:
          type: string
          nullable: true
          example: 4 hrs 12 mins 5 secs
        is_authored_by_user:
          type: boolean
          example: true
        message:
          type: string
          example: Initial commit
        ref:
          type: string
          nullable: true
          example: refs/heads/main
        total_seconds:
          type: number
          format: float
          nullable: true
          example: 4
        truncated_hash:
          type: string
          example: 9b8c4d2
        url:
          type: string
          format: uri
          nullable: true
          example: https://wakatime.com/@kinlane/projects/wakatime-cli
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://wakatime.com/oauth/authorize
          tokenUrl: https://wakatime.com/oauth/token
          refreshUrl: https://wakatime.com/oauth/token
          scopes:
            email: Read user email.
            read_summaries: Read coding-activity summaries.
            read_stats: Read aggregate stats.
            read_goals: Read coding goals.
            read_heartbeats: Read raw heartbeats.
            write_heartbeats: Send heartbeats.
            read_orgs: Read organization data.
            write_orgs: Modify organization data.
        implicit:
          authorizationUrl: https://wakatime.com/oauth/authorize
          scopes:
            email: Read user email.
            read_summaries: Read coding-activity summaries.
            read_stats: Read aggregate stats.
            read_goals: Read coding goals.
            read_heartbeats: Read raw heartbeats.
            write_heartbeats: Send heartbeats.
            read_orgs: Read organization data.
            write_orgs: Modify organization data.
    apiKey:
      type: http
      scheme: basic
      description: HTTP Basic with the WakaTime API key as the username. Alternatively, pass `?api_key=...` as a query parameter.
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token in the Authorization header as `Bearer waka_tok_...`.
